record_run:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: agent_harness_performance_tracker
    harness_version:
      required: true
      example: "sha256:3f9a1c2e"
      selector:
        text:
    outcome:
      required: true
      example: pass
      selector:
        select:
          options:
            - pass
            - fail
            - partial
    task_id:
      example: hacs-audit
      selector:
        text:
    task_class:
      example: publish
      selector:
        text:
    verified:
      default: false
      selector:
        boolean:
    turns:
      example: 14
      selector:
        number:
          min: 0
          mode: box
    tool_calls:
      example: 120
      selector:
        number:
          min: 0
          mode: box
    duration_s:
      example: 640
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: s
    input_tokens:
      selector:
        number:
          min: 0
          mode: box
    output_tokens:
      selector:
        number:
          min: 0
          mode: box
    cost_usd:
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    denials:
      default: 0
      selector:
        number:
          min: 0
          mode: box
    denial_classes:
      selector:
        object:
    retries:
      default: 0
      selector:
        number:
          min: 0
          mode: box
    interventions:
      default: 0
      selector:
        number:
          min: 0
          mode: box
    notes:
      selector:
        text:
          multiline: true

set_baseline:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: agent_harness_performance_tracker
    harness_version:
      example: "sha256:3f9a1c2e"
      selector:
        text:

remove_runs:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: agent_harness_performance_tracker
    run_keys:
      example: "8108db9db13640ef873ee272"
      selector:
        text:
          multiple: true
    recorded_at:
      example: "2026-09-29T18:30:13.083039+00:00"
      selector:
        text:
          multiple: true

retag_runs:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: agent_harness_performance_tracker
    runs:
      required: true
      example: '{"2026-09-19T08:47:53.626214+00:00": "ai-research:build"}'
      selector:
        object:
